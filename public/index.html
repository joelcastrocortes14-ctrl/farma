<div id="login" class="login hidden">
  <form id="loginForm" class="card">
    <div class="logo"><img src="logo-mark.svg" alt=""><div><b>Vital<i>Track</i></b><span>Control inteligente de farmacia</span></div></div>
    <label>Usuario <input name="usuario" autocomplete="username" required autofocus></label>
    <label>Contraseña <input name="password" type="password" autocomplete="current-password" required></label>
    <button class="btn primary lg">Entrar</button>
    <p id="loginErr" class="error"></p>
  </form>
</div>

<div id="app" class="hidden">
  <aside id="nav"></aside>
  <main>
    <header>
      <button id="menuBtn" class="btn ghost icon" aria-label="Menú"><svg class="ic"><use href="#i-menu"/></svg></button>
      <h2 id="titulo"></h2>
      <div class="gsearch"><svg class="ic"><use href="#i-search"/></svg><input id="gsearch" placeholder="Buscar producto… (ej. acetam)" autocomplete="off"><div id="gres" class="gres hidden"></div></div>
      <button id="btnScan" class="btn icon" title="Escanear código de barras o QR"><svg class="ic"><use href="#i-scan"/></svg><span class="lbl">Escanear</span></button>
      <button id="btnTema" class="btn ghost icon" aria-label="Modo oscuro" title="Modo claro / oscuro"><svg class="ic"><use href="#i-moon"/></svg></button>
      <span id="quien"></span>
    </header>
    <section id="main"></section>
  </main>
  <button id="botBtn" class="fab" aria-label="Asistente" title="Pregúntale al asistente"><svg class="ic"><use href="#i-bot"/></svg></button>
  <div id="botPanel" class="bot hidden"></div>
</div>

<dialog id="modal"><div id="modalBody"></div></dialog>
<div id="toasts"></div>
<script src="vendor/html5-qrcode.min.js"></script>
<script src="app.js"></script>
<script src="extras.js"></script>
<script src="importar.js"></script>
</body>
</html>
